<body>   
    <!-- HEADER -->
    <header class="header">

        <!-- LOGO -->
        <div class="header__logo">
            <img src="azura.png" alt="Logo">
        </div>

        <!-- NAVIGATION -->
        <nav class="header__nav nav">

            <ul class="nav__list">

                <li class="nav__item">
                    <a href="#" class="nav__link">Inicio</a>
                </li>

                <li class="nav__item">
                    <a href="#" class="nav__link">Menú</a>
                </li>

                <li class="nav__item nav__item--active">
                    <a href="#" class="nav__link">Galería</a>
                </li>

                <li class="nav__item">
                    <a href="#" class="nav__link">Contacto</a>
                </li>

            </ul>

        </nav>

        <!-- BUTTON -->
        <div class="header__actions">
            <button class="header__button">Pedido</button>
        </div>

    </header>
    <!-- MAIN -->
    <main class="main">

        <!-- HERO SECTION -->
        <section class="hero">

            <h1 class="hero__title title">
                Bienvenidos a Azura
            </h1>

            <p class="hero__text">
                Los mejores postres artesanales
            </p>

            <button class="hero__button">
                Ver Menú
            </button>

        </section>

        <!-- MENU SECTION -->
        <section class="menu">

            <h2 class="menu__title title">
                Nuestro Menú
            </h2>

            <ul class="menu__list">

                <li class="menu__item card">

                    <img src="#" alt="Postre" class="card__image">

                    <h3 class="card__title">
                        Tres Leches
                    </h3>

                    <p class="card__text">
                        Postre cremoso y delicioso
                    </p>

                </li>

                <li class="menu__item card">

                    <img src="#" alt="Postre" class="card__image">

                    <h3 class="card__title">
                        Alfajores
                    </h3>

                    <p class="card__text">
                        Rellenos de manjar blanco
                    </p>

                </li>

            </ul>

        </section>

        <!-- GALLERY SECTION -->
        <section class="gallery">

            <h2 class="gallery__title title">
                Galería
            </h2>

            <ul class="gallery__list">

                <li class="gallery__item">
                    <img src="#" alt="Imagen" class="gallery__image">
                </li>

                <li class="gallery__item">
                    <img src="#" alt="Imagen" class="gallery__image">
                </li>

                <li class="gallery__item">
                    <img src="#" alt="Imagen" class="gallery__image">
                </li>

            </ul>

        </section>

        <!-- CONTACT SECTION -->
        <section class="contact">

            <h2 class="contact__title title">
                Contacto
            </h2>

            <p class="contact__text">
                Correo: ejemplo@gmail.com
            </p>

            <p class="contact__text">
                Teléfono: 999999999
            </p>

        </section>

    </main>
</body>
